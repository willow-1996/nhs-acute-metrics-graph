name: Deploy shinylive to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rocker-org/shiny:latest

    steps:
      - uses: actions/checkout@v4

      # System deps not needed — Rocker/shiny includes libuv, libcurl, libssl
      # Install remaining system dep for archive package (needed by shinylive)
      - name: Install libarchive
        run: apt-get update -q && apt-get install -y -q libarchive-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          pak-version: stable
          upgrade: false
          extra-packages: |
            cran::r2d3
            cran::shinylive

      - name: Export shinylive app
        run: Rscript -e "shinylive::export('.', 'docs')"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
