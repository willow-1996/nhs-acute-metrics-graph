name: Deploy shinylive to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system dependencies
        run: sudo apt-get install -y libuv1-dev libcurl4-openssl-dev libssl-dev libarchive-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            shiny
            r2d3
            readr
            dplyr
            purrr
            DT
            tidyr
            jsonlite
            shinylive

      - name: Export shinylive app
        run: Rscript -e "shinylive::export('.', 'docs')"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
